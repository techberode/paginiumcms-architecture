# PaginiumCMS — LAN test nginx (same-origin SPA + API proxy)
#
# Topology (default):
#   Browser  →  http://192.168.10.26:8081/     (this nginx — static dist)
#   nginx    →  http://192.168.10.20:8080/     (PHP backend / Docker)
#
# Install:
#   sudo cp docs/deploy/nginx-paginium-test.conf /etc/nginx/sites-available/paginium-test
#   sudo ln -sf /etc/nginx/sites-available/paginium-test /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy frontend:
#   ./scripts/deploy-frontend-lan.sh
#
# Verify:
#   curl -s http://192.168.10.26:8081/api/health
#   curl -sI http://192.168.10.26:8081/feed.xml | head -5

# --- adjust if your backend runs elsewhere ---
upstream paginium_php_backend {
    server 192.168.10.20:8080;
    keepalive 8;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.10.26;

    root /var/www/paginium-test/dist;
    index index.html;

    # Media uploads (adjust if you need larger files)
    client_max_body_size 32m;

    access_log /var/log/nginx/paginium-test.access.log;
    error_log  /var/log/nginx/paginium-test.error.log;

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PHP API — MUST be before SPA fallback
    location /api/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Flat-file media served by PHP (It. 20)
    location /storage/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public XML feeds (It. 22) — MUST be before SPA fallback
    location = /feed.xml {
        proxy_pass http://paginium_php_backend/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_php_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — React Router (must be LAST)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Variant: backend on the SAME machine as nginx (uncomment, comment block above)
# ---------------------------------------------------------------------------
#
# upstream paginium_php_backend {
#     server 127.0.0.1:8080;
#     keepalive 8;
# }
#
