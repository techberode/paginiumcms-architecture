# PaginiumCMS — LAN test nginx with static dist.
# This vhost is not intended for Internet exposure.

upstream paginium_php_backend {
    server 192.168.10.20:8080;
    keepalive 8;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.10.26;
    server_tokens off;

    root /var/www/paginium-test/dist;
    index index.html;

    client_max_body_size 32m;
    access_log /var/log/nginx/paginium-test.access.log;
    error_log  /var/log/nginx/paginium-test.error.log;

    include /etc/nginx/snippets/paginium-security-headers-http.conf;

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/paginium-security-headers-http.conf;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/paginium-security-headers-http.conf;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location /api/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /storage/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /feed.xml {
        proxy_pass http://paginium_php_backend/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_php_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://paginium_php_backend/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        include /etc/nginx/snippets/paginium-security-headers-http.conf;
        try_files $uri $uri/ /index.html;
    }
}
