# PaginiumCMS — production/demo Docker override.
# Merge with ${APP_ROOT}/docker-compose.yml from the exact release tag.
# Copy to /var/lib/docker/compose/paginiumcms[-demo]/docker-compose.prod.yml.
# Stack .env must define APP_ROOT, COMPOSE_PROJECT_NAME, and BACKEND_PORT.

services:
  php:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    build:
      context: ${APP_ROOT}
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ${APP_ROOT}:/var/www/html
      # Deploy key: stack.sh auto-includes docker-compose.deploy-key.yml when the host
      # file exists. Do not store the private key in this compose directory.
      # Generate: SECRETS_DIR=/var/lib/paginiumcms/secrets ./scripts/bootstrap-github-deploy-key.sh
      # Optional: expose host stack wrapper so admin deploy readiness can see stack.sh.
      # Uncomment and set to your STACK_DIR (Settings → System update).
      # - /var/lib/docker/compose/paginiumcms:/var/lib/docker/compose/paginiumcms:ro
    env_file:
      - ${APP_ROOT}/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Bind-mount checkout (host UID ≠ www-data): git describe for AppVersion / system update.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /var/www/html
      # GITHUB_DEPLOY_SSH_KEY_PATH is set by docker-compose.deploy-key.yml (/run/secrets/…).

  nginx:
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      - php
    ports: !override
      - "127.0.0.1:${BACKEND_PORT}:80"
    volumes:
      - ${APP_ROOT}:/var/www/html:ro
      - ${APP_ROOT}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_ROOT}/docker/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
