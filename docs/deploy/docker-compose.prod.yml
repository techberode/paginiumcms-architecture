# PaginiumCMS — production/demo Docker override.
# Merge with ${APP_ROOT}/docker-compose.yml from the exact release tag.
# Copy to /var/lib/docker/compose/paginiumcms[-demo]/docker-compose.prod.yml.
# Stack .env must define APP_ROOT, COMPOSE_PROJECT_NAME, and BACKEND_PORT.

services:
  redis:
    # Base docker-compose.yml sets profiles: [cache] for local dev only.
    # Without !reset, production `stack.sh up -d` never starts Redis (PHP then fails redis:6379).
    profiles: !reset []
    # Base docker-compose.yml publishes 6379:6379 for local dev — prod must not bind host :6379
    # (conflicts with host Redis / leaves container in State "created"; PHP cannot reach service "redis").
    ports: !reset []
    image: redis:7.4-alpine
    restart: unless-stopped
    # REDIS_PASSWORD (stack .env) enables requirepass; the same value is passed to PHP below.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    # Bind mount under STACK_DIR (no top-level `volumes:` block required — avoids merge errors
    # when operators paste only the `services:` section into STACK_DIR/docker-compose.prod.yml).
    volumes:
      - ${STACK_DIR}/redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  php:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Code mount stays RW and FPM master runs as root (workers = www-data): admin
    # self-update runs git pull + npm build inside this container. Limits cap blast radius.
    mem_limit: ${PHP_MEM_LIMIT:-3g}
    cpus: ${PHP_CPUS:-2.0}
    pids_limit: ${PHP_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ${APP_ROOT}
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ${APP_ROOT}:/var/www/html
      # Deploy key: stack.sh auto-includes docker-compose.deploy-key.yml when the host
      # file exists. Do not store the private key in this compose directory.
      # Generate: SECRETS_DIR=/var/lib/paginiumcms/secrets ./scripts/bootstrap-github-deploy-key.sh
      # Admin deploy readiness: PHP must see host stack.sh (same path as Settings → stackDir).
      # Requires STACK_DIR in the stack .env (see DEPLOY.md §12.5).
      - ${STACK_DIR}:${STACK_DIR}:ro
    env_file:
      - ${APP_ROOT}/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Bind-mount checkout (host UID ≠ www-data): git describe for AppVersion / system update.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /var/www/html
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # GITHUB_DEPLOY_SSH_KEY_PATH is set by docker-compose.deploy-key.yml (/run/secrets/…).

  nginx:
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      - php
    ports: !override
      - "127.0.0.1:${BACKEND_PORT}:80"
    volumes:
      - ${APP_ROOT}:/var/www/html:ro
      - ${APP_ROOT}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_ROOT}/docker/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
