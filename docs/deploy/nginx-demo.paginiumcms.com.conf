# PaginiumCMS — demo instance (demo.paginiumcms.com)
# Host nginx serves the static frontend and proxies the API to a locally published Docker port.

upstream paginium_demo_php {
    server 127.0.0.1:8091;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.paginiumcms.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://demo.paginiumcms.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.paginiumcms.com;
    server_tokens off;

    root /var/www/paginiumcms-demo/frontend/dist;
    index index.html;
    client_max_body_size 64m;

    ssl_certificate     /etc/letsencrypt/live/demo.paginiumcms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.paginiumcms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/demo.paginiumcms.com.access.log;
    error_log  /var/log/nginx/demo.paginiumcms.com.error.log;

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/paginium-security-headers-https.conf;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/paginium-security-headers-https.conf;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location /api/ {
        proxy_pass http://paginium_demo_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /storage/ {
        proxy_pass http://paginium_demo_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
    }

    location = /feed.xml {
        proxy_pass http://paginium_demo_php/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_demo_php/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://paginium_demo_php/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        include /etc/nginx/snippets/paginium-security-headers-https.conf;
        try_files $uri $uri/ /index.html;
    }
}
