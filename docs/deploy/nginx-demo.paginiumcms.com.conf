# PaginiumCMS — demo instance (demo.paginiumcms.com)
#
# Topology (same host as prod, separate Docker stack):
#   Browser  →  https://demo.paginiumcms.com/     (this nginx — static dist)
#   nginx    →  http://127.0.0.1:8091/            (Docker demo — BACKEND_PORT v stack .env)
#
# Prerequisites:
#   APP_ROOT=/var/www/paginiumcms-demo
#   DEMO_MODE=true in .env
#   frontend/dist built (npm run build:prod, VITE_API_URL empty)
#   Docker stack: /srv/docker/paginiumcms-demo or /var/lib/docker/compose/paginiumcms-demo
#
# Install:
#   sudo cp docs/deploy/nginx-demo.paginiumcms.com.conf /etc/nginx/sites-available/demo.paginiumcms.com
#   sudo ln -sf /etc/nginx/sites-available/demo.paginiumcms.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (first time):
#   sudo certbot certonly --nginx -d demo.paginiumcms.com
#   # then uncomment ssl_* lines in the 443 server block below (or use certbot --nginx install)
#
# Verify:
#   curl -s http://127.0.0.1:8091/api/health | jq .
#   curl -s https://demo.paginiumcms.com/api/health | jq .
#   curl -sI https://demo.paginiumcms.com/feed.xml | head -3

upstream paginium_demo_php {
    server 127.0.0.1:8091;
    keepalive 8;
}

# --- HTTP → HTTPS (keep ACME path for certbot renew) ---
server {
    listen 80;
    listen [::]:80;
    server_name demo.paginiumcms.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://demo.paginiumcms.com$request_uri;
    }
}

# --- HTTPS + SPA same-origin /api ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.paginiumcms.com;

    root /var/www/paginiumcms-demo/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    ssl_certificate     /etc/letsencrypt/live/demo.paginiumcms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.paginiumcms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/demo.paginiumcms.com.access.log;
    error_log  /var/log/nginx/demo.paginiumcms.com.error.log;

    # Vite hashed assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PHP API — MUST be before SPA fallback
    location /api/ {
        proxy_pass http://paginium_demo_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Flat-file media (nginx → PHP)
    location /storage/ {
        proxy_pass http://paginium_demo_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public feeds — BEFORE SPA fallback
    location = /feed.xml {
        proxy_pass http://paginium_demo_php/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_demo_php/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://paginium_demo_php/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA (LAST)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

