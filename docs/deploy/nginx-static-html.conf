# It.48b — compiled HTML before the React SPA.
# Include this snippet only when engine.renderMode is hybrid or static.
# Do not enable it for Classic/dynamic: every public GET would take an extra PHP 404.
#
# /api /storage /assets and reserved admin first-segments stay dynamic.
# Missing compiled files fall through to the SPA (@spa_fallback).
#
# Usage (inside the HTTPS server block, before `location /`):
#   include /path/to/repo/docs/deploy/nginx-static-html.conf;

location = /static-html {
    return 404;
}

location ^~ /static-html/ {
    proxy_pass http://paginium_prod_php;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

location = / {
    proxy_pass http://paginium_prod_php/static-html/pages/home;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

# Admin / auth first segments — SPA only, no PHP hop.
location ~ ^/(account|analytics|api-keys|articles|audit|backups|blueprints|categories|code-editor|comments|dashboard|demo|developer|editorial-calendar|events|extensions|firewall|forgot-password|gallery|github|kanban|login|logout|logs|mail|media|messages|navigation|newsletter|notifications|origin|pages|platform|preview|project-planner|register|reset-password|redirects|roles|scheduler|security|security-audit|settings|setup|shortcodes|snippets|team-chat|teams|themes|time-tracker|trash|translations|update|users|widgets)$ {
    include /etc/nginx/snippets/paginium-security-headers-https.conf;
    try_files /index.html =404;
}

location ~ ^/blog/([a-z0-9][a-z0-9-]*)$ {
    proxy_pass http://paginium_prod_php/static-html/blog/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

location ~ ^/([a-z0-9][a-z0-9-]*)$ {
    proxy_pass http://paginium_prod_php/static-html/pages/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

location @spa_fallback {
    include /etc/nginx/snippets/paginium-security-headers-https.conf;
    try_files /index.html =404;
}
