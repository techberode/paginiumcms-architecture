# PaginiumCMS — LAN development nginx with Vite HMR.
# This vhost is not intended for Internet exposure.

upstream paginium_php_backend {
    server 192.168.10.20:8080;
    keepalive 8;
}

upstream paginium_vite_dev {
    server 192.168.10.20:3025;
    keepalive 4;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.10.26;
    server_tokens off;

    client_max_body_size 32m;
    access_log /var/log/nginx/paginium-dev.access.log;
    error_log  /var/log/nginx/paginium-dev.error.log;

    include /etc/nginx/snippets/paginium-security-headers-http.conf;

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/paginium-security-headers-http.conf;
        proxy_pass http://paginium_vite_dev/.well-known/security.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Content-Type "text/plain; charset=utf-8" always;
    }

    location /api/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /storage/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /feed.xml {
        proxy_pass http://paginium_php_backend/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_php_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://paginium_php_backend/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://paginium_vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
