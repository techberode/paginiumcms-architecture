# PaginiumCMS — LAN dev nginx (Vite HMR proxy on :8081, API on PHP backend)
#
# Use this instead of nginx-paginium-test.conf when you want hot reload at
# http://192.168.10.26:8081/ without opening :3025 in the browser.
#
# Prerequisites (on nginx host, e.g. 192.168.10.26):
#   1. Vite dev server running on 127.0.0.1:3025:
#        cd frontend && npm run dev:lan
#      — or: docker compose --profile dev up -d frontend
#   2. PHP backend reachable (default upstream below → 192.168.10.20:8080)
#
# Install:
#   sudo cp docs/deploy/nginx-paginium-dev.conf /etc/nginx/sites-available/paginium-dev
#   sudo ln -sf /etc/nginx/sites-available/paginium-dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Switch back to static prod-like test:
#   use nginx-paginium-test.conf + ./scripts/deploy-frontend-lan.sh

upstream paginium_php_backend {
    server 192.168.10.20:8080;
    keepalive 8;
}

upstream paginium_vite_dev {
    server 127.0.0.1:3025;
    keepalive 4;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.10.26;

    client_max_body_size 32m;

    access_log /var/log/nginx/paginium-dev.access.log;
    error_log  /var/log/nginx/paginium-dev.error.log;

    # PHP API — same as production-like LAN test
    location /api/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /storage/ {
        proxy_pass http://paginium_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /feed.xml {
        proxy_pass http://paginium_php_backend/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://paginium_php_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite dev server + HMR WebSocket (must be last)
    location / {
        proxy_pass http://paginium_vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
