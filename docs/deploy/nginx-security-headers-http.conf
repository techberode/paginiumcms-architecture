# PaginiumCMS — security headers for HTTP-only LAN/test nginx.
# HSTS is intentionally absent because this profile does not use HTTPS.
# Install as /etc/nginx/snippets/paginium-security-headers-http.conf.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# Legacy compatibility header; CSP is the primary XSS control.
add_header X-XSS-Protection "1; mode=block" always;
