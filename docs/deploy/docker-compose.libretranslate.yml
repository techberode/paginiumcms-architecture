# PaginiumCMS — optional LibreTranslate sidecar (It.76)
#
# Run on the SAME host as CMS (or reachable only from CMS via private network).
# Do NOT publish port 5000 on 0.0.0.0 — CMS calls it via nginx /internal/translate/.
#
# Start:
#   docker compose -f docs/deploy/docker-compose.libretranslate.yml up -d
#
# CMS (Settings → Translation):
#   provider: libretranslate
#   baseUrl: https://<your-cms-host>/internal/translate   (no /translate suffix)
#   apiKey: <from LibreTranslate when LT_API_KEYS=true>
#
# nginx: docs/deploy/nginx-internal-llm.conf.example (location /internal/translate/)
# Runbook: docs/sk/runbooks/AGENT_OPERATIONS.md §2

services:
  libretranslate:
    container_name: paginium-libretranslate
    image: ${LIBRETRANSLATE_IMAGE:-libretranslate/libretranslate:v1.6.4}
    ports:
      - "127.0.0.1:${LIBRETRANSLATE_PORT:-5000}:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${LIBRETRANSLATE_MEM_LIMIT:-6g}
    cpus: ${LIBRETRANSLATE_CPUS:-2}
    environment:
      # Paginium core locales + common neighbours (override via .env)
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-sk,en,cs}
      LT_UPDATE_MODELS: ${LT_UPDATE_MODELS:-true}
      LT_API_KEYS: ${LT_API_KEYS:-true}
      LT_API_KEYS_DB_PATH: /app/db/api_keys.db
      LT_REQ_LIMIT: ${LT_REQ_LIMIT:-120}
      LT_CHAR_LIMIT: ${LT_CHAR_LIMIT:-5000}
      LT_DISABLE_WEB_UI: ${LT_DISABLE_WEB_UI:-false}
    volumes:
      - libretranslate_api_keys:/app/db
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s

volumes:
  libretranslate_api_keys:
  libretranslate_models:
