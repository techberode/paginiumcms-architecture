# PaginiumCMS — security headers for HTTPS host nginx.
# Install as /etc/nginx/snippets/paginium-security-headers-https.conf.
# Include it in every location that defines its own add_header directive because
# nginx header inheritance changes when a child context sets add_header.

# Conservative default. Add includeSubDomains/preload only after an explicit
# domain-wide HTTPS and recovery audit.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# Legacy compatibility header; CSP is the primary XSS control.
add_header X-XSS-Protection "1; mode=block" always;
