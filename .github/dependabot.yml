version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-dev:
        patterns:
          - phpunit/*
          - phpstan/*
          - squizlabs/*
        update-types:
          - minor
          - patch

  # CI actions are pinned to commit SHAs; Dependabot bumps the SHA + version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
