name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          curl -sSfL "${base}/${archive}" -o "/tmp/${archive}"
          grep " ${archive}\$" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks (working tree + this event)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          chmod +x scripts/ci-gitleaks.sh
          ./scripts/ci-gitleaks.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer security audit
        run: composer audit

      - name: PHPStan level 8
        run: ./vendor/bin/phpstan analyse backend --level=8

      - name: PHPUnit
        env:
          PAGINIUMCMS_CI_STRICT_OUTPUT: '1'
        run: |
          chmod +x .github/scripts/run-backend-tests-ci.sh \
            .github/scripts/verify-ci-log-redaction.sh
          .github/scripts/run-backend-tests-ci.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: npm security audit
        run: npm audit --audit-level=critical

      - name: TypeScript type-check
        run: npm run type-check
      - name: ESLint
        run: npm run lint
      - name: API barrel lint (It.17)
        run: npm run lint:api-barrel
      - run: npm test
      - run: npm run test:msw
      - run: npm run build

  api-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist

      - name: Start backend
        run: |
          cd backend/public
          php -S localhost:8080 >/tmp/php-server.log 2>&1 &
          sleep 2
          curl -sf http://localhost:8080/api/health

      - name: Newman smoke (public endpoints)
        run: chmod +x scripts/run-api-smoke.sh && ./scripts/run-api-smoke.sh
