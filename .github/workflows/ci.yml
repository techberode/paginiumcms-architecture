name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, curl, gd, zip, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (static analysis)
        run: composer stan

      - name: PHPUnit (tests)
        run: composer test

  # POZNÁMKA: frontend CI job je zámerne (zatiaľ) vypnutý.
  # Blokujú ho tri chýbajúce/rozbité veci vo `frontend/`:
  #   1. chýba `tsconfig.json` -> `tsc --noEmit` je no-op (nič nekontroluje),
  #   2. chýba `eslint.config.js` (ESLint 9) -> `npm run lint` padá,
  #   3. `npm run test` (vitest 4 / vite 8 / rolldown) padá na natívnom bindingu.
  # Po doplnení tsconfig + eslint config a stabilizácii vitest stačí
  # odkomentovať job nižšie.
