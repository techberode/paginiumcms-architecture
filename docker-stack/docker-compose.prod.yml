# PaginiumCMS — production/demo Docker override.
# Merge with ${APP_ROOT}/docker-compose.yml from the exact release tag.
# Copy to /var/lib/docker/compose/paginiumcms[-demo]/docker-compose.prod.yml.
# Stack .env must define APP_ROOT, COMPOSE_PROJECT_NAME, and BACKEND_PORT.

services:
  php:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Code mount stays RW and FPM master runs as root (workers = www-data): admin
    # self-update runs git pull + npm build inside this container. Limits cap blast radius.
    mem_limit: ${PHP_MEM_LIMIT:-3g}
    cpus: ${PHP_CPUS:-2.0}
    pids_limit: ${PHP_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    build:
      context: ${APP_ROOT}
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ${APP_ROOT}:/var/www/html
      # Deploy key: stack.sh auto-includes docker-compose.deploy-key.yml when the host file exists.
      # Admin deploy readiness — STACK_DIR must match Settings → System update → stack directory.
      - ${STACK_DIR}:${STACK_DIR}:ro
    env_file:
      - ${APP_ROOT}/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # GITHUB_DEPLOY_SSH_KEY_PATH is set by docker-compose.deploy-key.yml (/run/secrets/…).

  nginx:
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      - php
    ports: !override
      - "127.0.0.1:${BACKEND_PORT}:80"
    volumes:
      - ${APP_ROOT}:/var/www/html:ro
      - ${APP_ROOT}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_ROOT}/docker/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
