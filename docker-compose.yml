# PaginiumCMS — lokálny stack (RECOMMENDATIONS Fáza 2)
#
# Backend API:  http://localhost:8080
# Frontend dev: docker compose --profile dev up frontend  → http://localhost:3025
# FE build:     docker compose --profile build run --rm frontend-build
#
# Published ports bind to 127.0.0.1 by default. For LAN testing set
# PAGINIUM_BIND=0.0.0.0 in your shell/.env (never on an internet-facing host).
# REDIS_PASSWORD (optional) enables Redis requirepass; PHP reads the same variable.

services:
  redis:
    profiles: ["cache"]
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "${PAGINIUM_BIND:-127.0.0.1}:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /var/www/html/frontend
    command: sh -c "npm ci && npm run dev:lan"
    ports:
      - "${PAGINIUM_BIND:-127.0.0.1}:3025:3025"
    volumes:
      - .:/var/www/html
    # Prázdne → axios ide na rovnaký origin (:3025) cez Vite proxy; cookies fungujú.
    # NIKDY http://localhost:8080 — cross-origin rozbije PHPSESSID (ISS-025).
    environment: {}
    depends_on:
      nginx:
        condition: service_healthy

  frontend-build:
    profiles: ["build"]
    image: node:22-alpine
    working_dir: /var/www/html/frontend
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/var/www/html

volumes:
  redis-data:
