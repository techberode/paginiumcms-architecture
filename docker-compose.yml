# PaginiumCMS — lokálny stack (RECOMMENDATIONS Fáza 2)
#
# Backend API:  http://localhost:8080
# Frontend dev: docker compose --profile dev up frontend  → http://localhost:3025
# FE build:     docker compose --profile build run --rm frontend-build

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /var/www/html/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "3025:3025"
    volumes:
      - .:/var/www/html
    # Prázdne → axios ide na rovnaký origin (:3025) cez Vite proxy; cookies fungujú.
    # NIKDY http://localhost:8080 — cross-origin rozbije PHPSESSID (ISS-025).
    environment: {}
    depends_on:
      nginx:
        condition: service_healthy

  frontend-build:
    profiles: ["build"]
    image: node:22-alpine
    working_dir: /var/www/html/frontend
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/var/www/html
