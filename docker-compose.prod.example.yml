# Production override — use ONLY via stack wrapper, not `docker compose up` in clone root.
#
#   cd /srv/docker/paginiumcms-prod
#   ./stack.sh up -d
#
# Stack .env:
#   APP_ROOT=/var/www/paginiumcms.com
#   COMPOSE_PROJECT_NAME=paginiumcms-prod
#   BACKEND_PORT=8089

services:
  php:
    restart: unless-stopped
    # Code mount stays RW (admin self-update builds in-container); limits cap blast radius.
    mem_limit: ${PHP_MEM_LIMIT:-3g}
    cpus: ${PHP_CPUS:-2.0}
    pids_limit: ${PHP_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    build:
      context: ${APP_ROOT}
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ${APP_ROOT}:/var/www/html
    env_file:
      - ${APP_ROOT}/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-256m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      - php
    # !override — base docker-compose.yml also maps 8080:80; merge would bind BOTH ports.
    ports: !override
      - "127.0.0.1:${BACKEND_PORT}:80"
    volumes:
      - ${APP_ROOT}:/var/www/html:ro
      - ${APP_ROOT}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
